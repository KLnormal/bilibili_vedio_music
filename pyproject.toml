[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-video-crawler"
version = "0.1.0"
description = "A local Bilibili UP-main video discovery and download system (btop-style TUI)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "qrcode>=7.4.2",
    "PyYAML>=6.0.1",
    "PySide6>=6.7.0",
]

[project.scripts]
bili-crawler = "bilibili_crawler.cli.commands:main"

[tool.setuptools.packages.find]
include = ["bilibili_crawler*"]
